<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <radialGradient id="goodlyGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF5108" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#E86C38" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C8B8"/>
      <stop offset="100%" stop-color="#B8A793"/>
    </linearGradient>
    <linearGradient id="pouch2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D323E"/>
      <stop offset="100%" stop-color="#1B1E26"/>
    </linearGradient>
    <linearGradient id="pouch3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A4A"/>
      <stop offset="100%" stop-color="#C55828"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#090B0E"/>
  <rect width="1200" height="700" fill="url(#goodlyGlow)"/>

  <!-- Subtle Studio Table Surface -->
  <ellipse cx="600" cy="580" rx="500" ry="100" fill="#000000" opacity="0.4" filter="blur(20px)"/>

  <!-- Pouch 1: Sea Salt (Left) -->
  <g transform="translate(240, 160)">
    <!-- Shadow -->
    <ellipse cx="120" cy="420" rx="110" ry="24" fill="#000000" opacity="0.6" filter="blur(10px)"/>
    <!-- Pouch Body -->
    <path d="M 20,40 Q 120,30 220,40 L 205,390 Q 120,410 35,390 Z" fill="url(#pouch1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Top Seal Ridge -->
    <path d="M 20,40 Q 120,30 220,40 L 220,55 Q 120,45 20,55 Z" fill="#9F8E79"/>
    <!-- Label Details -->
    <circle cx="120" cy="160" r="32" fill="#FFFFFF" opacity="0.95"/>
    <text x="120" y="166" fill="#1B1E26" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">G.</text>
    <text x="120" y="230" fill="#1B1E26" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">GOODLY</text>
    <text x="120" y="255" fill="#4A453E" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ROASTED SEA SALT</text>
    <line x1="60" y1="275" x2="180" y2="275" stroke="#1B1E26" stroke-width="1" opacity="0.3"/>
    <text x="120" y="320" fill="#2E2B27" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">100% ORGANIC PLANT PROTEIN</text>
    <rect x="85" y="340" width="70" height="20" rx="4" fill="#1B1E26"/>
    <text x="120" y="354" fill="#F4F2ED" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">NET 140g</text>
  </g>

  <!-- Pouch 2: Dark Cacao (Center, Highlighted Hero) -->
  <g transform="translate(480, 110)">
    <!-- Shadow -->
    <ellipse cx="120" cy="460" rx="130" ry="28" fill="#000000" opacity="0.75" filter="blur(14px)"/>
    <!-- Pouch Body -->
    <path d="M 15,35 Q 120,25 225,35 L 210,430 Q 120,450 30,430 Z" fill="url(#pouch2)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Top Seal -->
    <path d="M 15,35 Q 120,25 225,35 L 225,52 Q 120,42 15,52 Z" fill="#16181F"/>
    <!-- Brand Mark with Color Vision Orange Badge -->
    <circle cx="120" cy="170" r="36" fill="#FF5108"/>
    <text x="120" y="178" fill="#08090D" font-family="sans-serif" font-size="28" font-weight="900" text-anchor="middle">G.</text>
    <text x="120" y="245" fill="#F4F2ED" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="4">GOODLY</text>
    <text x="120" y="272" fill="#FF5108" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">RAW CACAO &amp; CRUNCH</text>
    <line x1="50" y1="295" x2="190" y2="295" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Minimal Botanical Icon -->
    <circle cx="120" cy="335" r="16" fill="none" stroke="#FF5108" stroke-width="1.5"/>
    <path d="M 120,325 Q 128,335 120,345 Q 112,335 120,325 Z" fill="#FF5108"/>
    <text x="120" y="375" fill="#8E9098" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="1.5">ORGANIC SUSTAINABLE SNACK</text>
    <rect x="80" y="390" width="80" height="22" rx="4" fill="#FF5108"/>
    <text x="120" y="405" fill="#08090D" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">NET 160g</text>
  </g>

  <!-- Pouch 3: Smoked Chili (Right) -->
  <g transform="translate(730, 160)">
    <!-- Shadow -->
    <ellipse cx="120" cy="420" rx="110" ry="24" fill="#000000" opacity="0.6" filter="blur(10px)"/>
    <!-- Pouch Body -->
    <path d="M 20,40 Q 120,30 220,40 L 205,390 Q 120,410 35,390 Z" fill="url(#pouch3)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Top Seal -->
    <path d="M 20,40 Q 120,30 220,40 L 220,55 Q 120,45 20,55 Z" fill="#A4421B"/>
    <!-- Label Details -->
    <circle cx="120" cy="160" r="32" fill="#090B0E"/>
    <text x="120" y="167" fill="#F4F2ED" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">G.</text>
    <text x="120" y="230" fill="#090B0E" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">GOODLY</text>
    <text x="120" y="255" fill="#2E1107" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SMOKED ALMOND</text>
    <line x1="60" y1="275" x2="180" y2="275" stroke="#090B0E" stroke-width="1" opacity="0.3"/>
    <text x="120" y="320" fill="#2E1107" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">100% WHOLE FOOD INGREDIENTS</text>
    <rect x="85" y="340" width="70" height="20" rx="4" fill="#090B0E"/>
    <text x="120" y="354" fill="#F4F2ED" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">NET 140g</text>
  </g>
</svg>
