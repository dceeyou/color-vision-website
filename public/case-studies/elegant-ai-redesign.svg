<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#0A0B10"/>
  <rect x="40" y="40" width="920" height="520" rx="14" fill="url(#modernBg)" stroke="#FF5108" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="920" height="48" rx="14" fill="#181B26"/>
  <circle cx="68" cy="64" r="5" fill="#FF5108"/>
  <text x="85" y="69" fill="#F4F2ED" font-family="sans-serif" font-size="13" font-weight="700">Agent Flow Designer</text>
  <rect x="800" y="52" width="140" height="24" rx="12" fill="#FF5108"/>
  <text x="870" y="68" fill="#08090D" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">LIVE STREAMING</text>

  <!-- Flow Visualizer -->
  <g transform="translate(80, 140)">
    <!-- Stage 1 -->
    <rect x="0" y="60" width="180" height="100" rx="10" fill="#1A1E29" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="95" fill="#8E9098" font-family="sans-serif" font-size="10" font-weight="700">INPUT SOURCE</text>
    <text x="20" y="125" fill="#F4F2ED" font-family="sans-serif" font-size="15" font-weight="700">API Gateway</text>

    <!-- Connector -->
    <path d="M 180,110 L 260,110" stroke="#FF5108" stroke-width="2"/>
    <circle cx="220" cy="110" r="4" fill="#FF5108"/>

    <!-- Stage 2 -->
    <rect x="260" y="20" width="220" height="180" rx="12" fill="#202433" stroke="#FF5108" stroke-width="2"/>
    <text x="280" y="55" fill="#FF5108" font-family="sans-serif" font-size="11" font-weight="800">AGENT ORCHESTRATOR</text>
    <text x="280" y="85" fill="#F4F2ED" font-family="sans-serif" font-size="17" font-weight="700">Autonomous Core</text>
    <rect x="280" y="110" width="180" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="280" y="110" width="135" height="6" rx="3" fill="#FF5108"/>
    <text x="280" y="140" fill="#8E9098" font-family="monospace" font-size="11">Throughput: 98.6%</text>
    <text x="280" y="165" fill="#8E9098" font-family="monospace" font-size="11">Latency: 18ms</text>

    <!-- Connectors -->
    <path d="M 480,80 L 560,50" stroke="#FF5108" stroke-width="2"/>
    <path d="M 480,140 L 560,170" stroke="#FF5108" stroke-width="2"/>

    <!-- Stage 3A & 3B -->
    <rect x="560" y="10" width="200" height="80" rx="10" fill="#1A1E29" stroke="rgba(255,255,255,0.12)"/>
    <text x="580" y="40" fill="#8E9098" font-family="sans-serif" font-size="10" font-weight="700">SUB-AGENT A</text>
    <text x="580" y="65" fill="#F4F2ED" font-family="sans-serif" font-size="14" font-weight="700">Context Search</text>

    <rect x="560" y="130" width="200" height="80" rx="10" fill="#1A1E29" stroke="rgba(255,255,255,0.12)"/>
    <text x="580" y="160" fill="#8E9098" font-family="sans-serif" font-size="10" font-weight="700">SUB-AGENT B</text>
    <text x="580" y="185" fill="#F4F2ED" font-family="sans-serif" font-size="14" font-weight="700">Code Formatter</text>
  </g>

  <!-- Metrics Ribbon -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="840" height="90" rx="10" fill="#11141C" stroke="rgba(255,255,255,0.06)"/>
    <text x="30" y="35" fill="#8E9098" font-family="sans-serif" font-size="11" font-weight="700">TOTAL TASKS</text>
    <text x="30" y="68" fill="#F4F2ED" font-family="sans-serif" font-size="24" font-weight="800">1,420,891</text>

    <line x1="280" y1="20" x2="280" y2="70" stroke="rgba(255,255,255,0.08)"/>
    <text x="310" y="35" fill="#8E9098" font-family="sans-serif" font-size="11" font-weight="700">FAILURE RATE</text>
    <text x="310" y="68" fill="#FF5108" font-family="sans-serif" font-size="24" font-weight="800">0.02%</text>

    <line x1="560" y1="20" x2="560" y2="70" stroke="rgba(255,255,255,0.08)"/>
    <text x="590" y="35" fill="#8E9098" font-family="sans-serif" font-size="11" font-weight="700">USER SATISFACTION</text>
    <text x="590" y="68" fill="#F4F2ED" font-family="sans-serif" font-size="24" font-weight="800">99.1%</text>
  </g>
</svg>
